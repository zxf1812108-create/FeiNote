<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞记</title>
<style>
  :root {
    --bg: #F5F5F5;
    --surface: #FAFAFA;
    --surface-variant: #EFEFEB;
    --surface-dialog: #FFFFFF;
    --surface-high: #ECECE8;
    --text: #333333;
    --text-secondary: #6F6F6B;
    --text-muted: rgba(51, 51, 51, 0.42);
    --icon-muted: rgba(51, 51, 51, 0.38);
    --border: #E0E0DC;
    --outline: #BFBFBB;
    --primary: #333333;
    --on-primary: #F5F5F5;
    --primary-container: #E6E6E2;
    --error: #B42318;
    --error-bg: #FCEAEA;
    --online: #2E7D32;
    --scrim: rgba(20, 20, 18, 0.36);
    --shadow-dialog: 0 18px 48px rgba(0, 0, 0, 0.12);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-xl: 20px;
  }

  [data-theme="dark"] {
    --bg: #161615;
    --surface: #1F1F1D;
    --surface-variant: #232320;
    --surface-dialog: #252523;
    --surface-high: #2C2C29;
    --text: #C8C8C3;
    --text-secondary: #8E8E88;
    --text-muted: rgba(200, 200, 195, 0.45);
    --icon-muted: rgba(200, 200, 195, 0.40);
    --border: #2E2E2B;
    --outline: #454540;
    --primary: #A8A8A2;
    --on-primary: #161615;
    --primary-container: #32322E;
    --error: #CF6E68;
    --error-bg: #3A2422;
    --online: #5CA974;
    --scrim: rgba(0, 0, 0, 0.58);
    --shadow-dialog: 0 22px 56px rgba(0, 0, 0, 0.46);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  button, input, textarea {
    font: inherit;
    color: inherit;
  }

  button {
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.36;
    cursor: not-allowed;
  }

  .hidden {
    display: none !important;
  }

  /* ===== Auth Screen ===== */
  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .auth-panel {
    width: 100%;
    max-width: 360px;
    background: var(--surface-dialog);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 32px 28px 28px;
    box-shadow: var(--shadow-dialog);
  }

  .auth-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .auth-title {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .auth-desc {
    margin: 0 0 22px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.55;
  }

  .pin-input {
    width: 100%;
    text-align: center;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.36em;
    padding: 13px 14px 13px 22px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--outline);
    border-radius: var(--radius-md);
    outline: none;
    transition: border-color 0.15s ease;
    font-variant-numeric: tabular-nums;
  }

  .pin-input:focus {
    border-color: var(--primary);
  }

  .pin-input::placeholder {
    letter-spacing: 0.08em;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-muted);
  }

  .auth-submit {
    width: 100%;
    margin-top: 14px;
    height: 44px;
    border-radius: var(--radius-md);
    background: var(--primary);
    color: var(--on-primary);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.03em;
    transition: opacity 0.15s ease;
  }

  .auth-submit:hover:not(:disabled) {
    opacity: 0.9;
  }

  .auth-error {
    margin-top: 12px;
    min-height: 18px;
    font-size: 12.5px;
    color: var(--error);
    text-align: center;
  }

  /* ===== App Shell ===== */
  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar-wrap {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--bg);
    border-bottom: 1px solid transparent;
    transition: border-color 0.18s ease;
  }

  .topbar-wrap.scrolled {
    border-bottom-color: var(--border);
  }

  .topbar {
    max-width: 720px;
    margin: 0 auto;
    height: 54px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .left-slot {
    width: 44px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    flex-shrink: 0;
    color: var(--icon-muted);
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .left-slot:hover {
    background: var(--surface-variant);
    color: var(--text);
  }

  .left-slot.is-back {
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
  }

  .date-cluster {
    display: flex;
    align-items: center;
    gap: 2px;
    min-width: 0;
  }

  .date-label-btn {
    padding: 5px 8px;
    border-radius: 8px;
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: background-color 0.15s ease;
  }

  .date-label-btn:hover {
    background: var(--surface-variant);
  }

  .day-step-btn {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--icon-muted);
    font-size: 18px;
    line-height: 1;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .day-step-btn:hover {
    background: var(--surface-variant);
    color: var(--text);
  }

  .topbar-spacer {
    flex: 1;
    min-width: 8px;
  }

  .search-box-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    height: 36px;
    border: 1px solid var(--outline);
    border-radius: 8px;
    padding: 0 8px 0 11px;
    background: transparent;
    transition: border-color 0.15s ease;
  }

  .search-box-wrap:focus-within {
    border-color: var(--primary);
  }

  .search-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    color: var(--text);
  }

  .search-input::placeholder {
    color: var(--text-muted);
  }

  .search-clear-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--icon-muted);
  }

  .search-clear-btn:hover {
    color: var(--text);
    background: var(--surface-variant);
  }

  .scope-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--icon-muted);
    flex-shrink: 0;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .scope-btn:hover {
    background: var(--surface-variant);
    color: var(--text);
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--icon-muted);
    position: relative;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .icon-btn:hover {
    background: var(--surface-variant);
    color: var(--text);
  }

  .trash-count-dot {
    position: absolute;
    top: 5px;
    right: 4px;
    font-size: 10px;
    line-height: 1;
    font-weight: 600;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .conn-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 6px;
    height: 36px;
    border-radius: 9px;
    color: var(--text-muted);
    font-size: 12px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .conn-indicator:hover {
    background: var(--surface-variant);
    color: var(--text);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--online);
    flex-shrink: 0;
  }

  .status-dot.offline {
    background: var(--error);
  }

  /* ===== Main Canvas ===== */
  .canvas-main {
    flex: 1;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 6px 20px 96px;
    display: flex;
    flex-direction: column;
  }

  .notes-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .search-date-header {
    padding: 14px 8px 4px 36px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
  }

  .search-date-link {
    padding: 2px 6px;
    margin-left: -6px;
    border-radius: 6px;
    color: var(--text-secondary);
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .search-date-link:hover {
    background: var(--surface-variant);
    color: var(--text);
  }

  /* ===== Note Row ===== */
  .note-row {
    display: flex;
    align-items: flex-start;
    padding: 7px 6px 7px 2px;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    transition: background-color 0.14s ease, border-color 0.14s ease;
    position: relative;
  }

  .note-row:hover:not(.editing) {
    background: color-mix(in srgb, var(--surface-variant) 55%, transparent);
  }

  .note-row.editing {
    background: var(--surface);
    border-color: var(--border);
    padding: 9px 10px 8px 6px;
    margin: 2px 0;
  }

  .note-row.drag-over-top {
    box-shadow: inset 0 2px 0 0 var(--primary);
  }

  .note-row.drag-over-bottom {
    box-shadow: inset 0 -2px 0 0 var(--primary);
  }

  .note-row.dragging {
    opacity: 0.42;
  }

  .drag-handle {
    width: 18px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--icon-muted);
    opacity: 0;
    cursor: grab;
    flex-shrink: 0;
    margin-right: 2px;
    transition: opacity 0.14s ease, color 0.14s ease;
  }

  .note-row:hover .drag-handle,
  .drag-handle:focus-visible {
    opacity: 0.72;
  }

  .drag-handle:hover {
    opacity: 1;
    color: var(--text);
  }

  .drag-handle:active {
    cursor: grabbing;
  }

  .note-row.editing .drag-handle {
    visibility: hidden;
  }

  .bullet-btn {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    flex-shrink: 0;
    margin-right: 6px;
    transition: background-color 0.14s ease, transform 0.1s ease;
  }

  .bullet-btn:hover {
    background: var(--surface-variant);
  }

  .bullet-btn:active {
    transform: scale(0.92);
  }

  .note-body {
    flex: 1;
    min-width: 0;
    padding-top: 2px;
  }

  .note-text-display {
    font-size: 15.5px;
    line-height: 1.62;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    cursor: text;
    min-height: 25px;
  }

  .note-text-display.is-checked {
    color: var(--text-secondary);
    text-decoration: line-through;
  }

  /* ===== Markdown Browse Styles ===== */
  .note-text-display.md-root {
    white-space: normal;
  }

  .md-p {
    margin: 0;
    white-space: pre-wrap;
  }

  .md-p + .md-p,
  .md-block + .md-block {
    margin-top: 3px;
  }

  .md-blank {
    height: 8px;
  }

  .md-h1, .md-h2, .md-h3 {
    margin: 4px 0 2px;
    font-weight: 700;
    color: var(--text);
    white-space: pre-wrap;
  }

  .md-block:first-child.md-h1,
  .md-block:first-child.md-h2,
  .md-block:first-child.md-h3 {
    margin-top: 0;
  }

  .md-h1 { font-size: 1.24em; line-height: 1.4; }
  .md-h2 { font-size: 1.14em; line-height: 1.45; font-weight: 600; }
  .md-h3 { font-size: 1.07em; line-height: 1.5; font-weight: 600; }

  .md-inline-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88em;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(128, 128, 128, 0.14);
  }

  .md-code-block {
    margin: 4px 0;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-variant);
    overflow-x: auto;
  }

  .md-code-lang {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .md-code-pre {
    margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.52;
    white-space: pre;
    color: var(--text);
  }

  .md-quote {
    margin: 3px 0;
    padding: 1px 0 1px 10px;
    border-left: 3px solid var(--border-strong, rgba(128, 128, 128, 0.35));
    color: var(--text-secondary);
  }

  .md-hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 7px 0;
  }

  .md-list-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }

  .md-list-bullet {
    flex: 0 0 auto;
    color: var(--text-secondary);
    font-weight: 700;
    user-select: none;
  }

  .md-list-num {
    flex: 0 0 auto;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  .md-list-content {
    flex: 1;
    min-width: 0;
    white-space: pre-wrap;
  }

  .md-task-box {
    flex: 0 0 auto;
    width: 15px;
    height: 15px;
    margin-top: 5px;
    border-radius: 3px;
    border: 1.5px solid var(--text-secondary);
    background: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    color: var(--text-secondary);
  }

  .md-task-box:hover {
    border-color: var(--text);
    color: var(--text);
  }

  .md-task-done {
    color: var(--text-secondary);
    text-decoration: line-through;
  }

  .md-link {
    color: #1F5FAD;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  [data-theme="dark"] .md-link {
    color: #8AB4F8;
  }

  .md-img-tag {
    color: var(--text-secondary);
  }

  .note-meta-inline {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 3px;
  }

  .alarm-inline-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    color: var(--text-secondary);
    padding: 1px 5px;
    margin-left: -5px;
    border-radius: 5px;
    font-variant-numeric: tabular-nums;
    transition: background-color 0.14s ease, color 0.14s ease;
  }

  .alarm-inline-btn:hover:not(:disabled) {
    background: var(--surface-variant);
    color: var(--text);
  }

  .alarm-inline-btn.readonly {
    cursor: default;
    opacity: 0.78;
  }

  .row-hover-actions {
    display: flex;
    align-items: center;
    gap: 1px;
    margin-left: 8px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.14s ease;
  }

  .note-row:hover .row-hover-actions,
  .note-row:focus-within .row-hover-actions {
    opacity: 1;
  }

  .row-action-btn {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--icon-muted);
    transition: background-color 0.14s ease, color 0.14s ease;
  }

  .row-action-btn:hover {
    background: var(--surface-high);
    color: var(--text);
  }

  .row-action-btn.danger:hover {
    color: var(--error);
    background: var(--error-bg);
  }

  /* ===== Inline Editor ===== */
  .note-editor-textarea {
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font-size: 15.5px;
    line-height: 1.62;
    color: var(--text);
    padding: 0;
    margin: 0;
    min-height: 26px;
    overflow: hidden;
    display: block;
  }

  .note-editor-textarea::placeholder {
    color: var(--text-muted);
  }

  .edit-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    padding-top: 7px;
    border-top: 1px solid var(--border);
  }

  .edit-toolbar-left {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .edit-toolbar-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tool-icon-btn {
    height: 28px;
    min-width: 28px;
    padding: 0 6px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-secondary);
    transition: background-color 0.14s ease, color 0.14s ease;
  }

  .tool-icon-btn:hover {
    background: var(--surface-high);
    color: var(--text);
  }

  .tool-icon-btn.active {
    color: var(--text);
    font-weight: 500;
  }

  .tool-icon-btn.danger:hover {
    color: var(--error);
    background: var(--error-bg);
  }

  .tool-text-btn {
    height: 28px;
    padding: 0 10px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: background-color 0.14s ease, color 0.14s ease;
  }

  .tool-text-btn:hover {
    background: var(--surface-high);
    color: var(--text);
  }

  .tool-text-btn.primary {
    color: var(--text);
    font-weight: 600;
    border: 1px solid var(--border);
  }

  /* ===== Keyword Hint Card ===== */
  .keyword-hint-card {
    margin: 4px 0 6px 46px;
    padding: 9px 12px;
    background: var(--surface-dialog);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .keyword-hint-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .keyword-hint-title {
    font-weight: 600;
    color: var(--text);
  }

  .keyword-hint-nav {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-variant-numeric: tabular-nums;
  }

  .hint-mini-btn {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
  }

  .hint-mini-btn:hover {
    background: var(--surface-variant);
    color: var(--text);
  }

  .keyword-hint-body {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ===== Bottom Blank Canvas / Quick Add ===== */
  .canvas-tail {
    flex: 1;
    min-height: 180px;
    padding-top: 8px;
    cursor: text;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .quick-add-line {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px 7px 22px;
    border-radius: var(--radius-md);
    color: var(--text-muted);
    font-size: 14px;
    transition: color 0.14s ease, background-color 0.14s ease;
  }

  .quick-add-line:hover {
    color: var(--text-secondary);
    background: color-mix(in srgb, var(--surface-variant) 50%, transparent);
  }

  .empty-state {
    padding: 56px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    user-select: none;
  }

  /* ===== Modals (FeiNote Consistent) ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: var(--scrim);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-card {
    background: var(--surface-dialog);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow-dialog);
    color: var(--text);
    max-width: 100%;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ----- Calendar Date Picker Modal ----- */
  .calendar-modal {
    width: 332px;
    padding: 16px;
  }

  .calendar-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    text-align: center;
    margin-bottom: 6px;
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .cal-nav-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--text-secondary);
  }

  .cal-nav-btn:hover {
    background: var(--surface-variant);
    color: var(--text);
  }

  .cal-ym-group {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .cal-ym-btn {
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .cal-ym-btn:hover {
    background: var(--surface-variant);
  }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 4px;
  }

  .cal-weekday {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    padding: 3px 0;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    row-gap: 2px;
  }

  .cal-cell {
    height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    position: relative;
  }

  .cal-cell.interactive:hover .cal-day-num:not(.selected) {
    background: var(--surface-variant);
  }

  .cal-day-num {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .cal-day-num.today:not(.selected) {
    border: 1px solid var(--primary);
    font-weight: 600;
  }

  .cal-day-num.selected {
    background: var(--primary);
    color: var(--on-primary);
    font-weight: 700;
  }

  .cal-note-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text-secondary);
    margin-top: 2px;
    opacity: 0.72;
  }

  .cal-note-dot.empty {
    visibility: hidden;
  }

  .cal-subgrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 10px 4px;
    max-height: 268px;
    overflow-y: auto;
  }

  .cal-sub-item {
    height: 42px;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .cal-sub-item:hover {
    background: var(--surface-variant);
  }

  .cal-sub-item.active {
    background: var(--primary);
    color: var(--on-primary);
    border-color: var(--primary);
    font-weight: 700;
  }

  .cal-sub-item.active .cal-note-dot {
    background: var(--on-primary);
  }

  .cal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  /* ----- Alarm Clock Dial Modal (Exact NoteAlarmDialog) ----- */
  .alarm-modal {
    width: 340px;
    border-radius: 22px;
    padding: 22px 22px 14px;
    align-items: center;
  }

  .alarm-hint {
    width: 100%;
    text-align: center;
    font-size: 15px;
    line-height: 21px;
    letter-spacing: 0.02em;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .alarm-hint.warn {
    color: var(--text-secondary);
  }

  .alarm-time-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .time-seg-btn {
    min-width: 72px;
    height: 54px;
    border-radius: 12px;
    border: 1px solid transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    transition: background-color 0.14s ease, border-color 0.14s ease;
  }

  .time-seg-btn.unset {
    color: var(--text-muted);
    font-weight: 400;
  }

  .time-seg-btn.active {
    background: var(--surface-high);
    border-color: var(--outline);
  }

  .time-colon {
    font-size: 30px;
    font-weight: 300;
    color: var(--text-muted);
    padding: 0 8px;
    user-select: none;
  }

  .clock-dial-wrap {
    width: 244px;
    height: 244px;
    position: relative;
    user-select: none;
    touch-action: none;
    cursor: pointer;
    margin-bottom: 16px;
  }

  .clock-dial-svg {
    width: 244px;
    height: 244px;
    display: block;
  }

  .alarm-footer {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-text-btn {
    height: 36px;
    padding: 0 12px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: background-color 0.14s ease, color 0.14s ease;
  }

  .modal-text-btn:hover:not(:disabled) {
    background: var(--surface-variant);
    color: var(--text);
  }

  .modal-text-btn.primary {
    color: var(--text);
    font-weight: 700;
  }

  .modal-text-btn.danger {
    color: var(--error);
    font-weight: 700;
  }

  /* ----- Star Review Modal ----- */
  .review-modal {
    width: 278px;
    border-radius: 16px;
    padding: 16px;
  }

  .review-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .review-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }


  .review-status {
    margin: 3px 0 13px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .review-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .review-option-btn {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background-color 0.14s ease, border-color 0.14s ease;
  }

  .review-option-btn:hover {
    background: var(--surface-variant);
    border-color: var(--outline);
  }

  .review-option-label {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }

  .review-option-days {
    font-size: 13px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* ----- Memory Curve Settings Modal ----- */
  .curve-modal {
    width: 372px;
    border-radius: 16px;
    padding: 18px 18px 12px;
  }

  .curve-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
  }

  .curve-desc {
    margin: 4px 0 12px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-secondary);
  }

  .curve-scroll {
    overflow-y: auto;
    max-height: 52vh;
    padding-right: 2px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .curve-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .curve-row-info {
    flex: 1;
    min-width: 0;
  }

  .curve-row-label {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
  }

  .curve-row-sub {
    font-size: 11px;
    color: var(--text-secondary);
  }

  .stepper {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .stepper-btn {
    width: 28px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--text-secondary);
  }

  .stepper-btn:hover {
    background: var(--surface-variant);
    color: var(--text);
  }

  .stepper-input {
    width: 56px;
    height: 30px;
    border: none;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    background: transparent;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    outline: none;
    color: var(--text);
  }

  .curve-preview {
    margin-top: 4px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 12px;
    line-height: 1.65;
    color: var(--text-secondary);
  }

  .curve-preview-head {
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .curve-footer {
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* ----- Trash Bin Modal (FeiArticle Style) ----- */
  .trash-modal {
    width: 540px;
    height: min(620px, 84vh);
    padding: 16px 18px;
  }

  .trash-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .trash-head-info {
    flex: 1;
    min-width: 0;
  }

  .trash-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .trash-sub {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .trash-empty-btn {
    padding: 5px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: background-color 0.14s ease, color 0.14s ease;
  }

  .trash-empty-btn:hover {
    background: var(--surface-variant);
    color: var(--text);
  }

  .trash-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 0 4px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .trash-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
  }

  .trash-item-body {
    flex: 1;
    min-width: 0;
  }

  .trash-item-content {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  .trash-item-meta {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .trash-restore-btn {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    flex-shrink: 0;
    transition: background-color 0.14s ease, color 0.14s ease;
  }

  .trash-restore-btn:hover {
    background: var(--surface-variant);
    color: var(--text);
  }

  .trash-empty-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    font-size: 14px;
  }

  /* ----- Confirm Modal ----- */
  .confirm-modal {
    width: 340px;
    padding: 20px 20px 14px;
  }

  .confirm-title {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 700;
  }

  .confirm-text {
    margin: 0 0 18px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--text-secondary);
  }

  .confirm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }

  /* ===== Snackbar Toast ===== */
  .toast-wrap {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 120;
    pointer-events: none;
  }

  .toast-box {
    pointer-events: auto;
    min-width: 200px;
    max-width: min(440px, calc(100vw - 32px));
    background: var(--surface-dialog);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    box-shadow: var(--shadow-dialog);
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13.5px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .toast-box.show {
    opacity: 1;
    transform: translateY(0);
  }

  .toast-msg {
    flex: 1;
  }

  .toast-action {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    padding: 3px 8px;
    border-radius: 6px;
  }

  .toast-action:hover {
    background: var(--surface-variant);
  }

  @media (max-width: 600px) {
    .topbar {
      padding: 0 12px;
    }
    .canvas-main {
      padding: 4px 12px 84px;
    }
    .drag-handle {
      display: none;
    }
    .row-hover-actions {
      opacity: 0.72;
    }
    .keyword-hint-card {
      margin-left: 28px;
    }
  }
</style>
</head>
<body>

<!-- ===== Auth View ===== -->
<section id="authView" class="auth-screen">
  <div class="auth-panel">
    <div class="auth-brand">
      <h1 class="auth-title">飞记</h1>
      <button id="authThemeBtn" class="icon-btn" type="button" title="切换深浅色主题"></button>
    </div>
    <p class="auth-desc">输入手机端「电脑直连」页面显示的 6 位配对码，在当前局域网内同步读写笔记。</p>
    <input id="pinInput" class="pin-input" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位配对码">
    <button id="authBtn" class="auth-submit" type="button">连接</button>
    <div id="authError" class="auth-error"></div>
  </div>
</section>

<!-- ===== Main Editor App ===== -->
<div id="appView" class="app-shell hidden">
  <header id="topbarWrap" class="topbar-wrap">
    <div class="topbar">
      <!-- Browse Mode Left + Date -->
      <button id="leftSlotBtn" class="left-slot" type="button" title="搜索笔记（右键搜五角星）"></button>

      <div id="browseHeaderGroup" class="date-cluster">
        <button id="dateLabelBtn" class="date-label-btn" type="button" title="点击选择日期（右键跳到最早五角星笔记）"></button>
        <button id="prevDayBtn" class="day-step-btn" type="button" title="前一天 (Alt+←)">‹</button>
        <button id="nextDayBtn" class="day-step-btn" type="button" title="后一天 (Alt+→)">›</button>
      </div>

      <!-- Search Mode Input + Scope -->
      <div id="searchHeaderGroup" class="search-box-wrap hidden">
        <input id="searchInput" class="search-input" type="text" placeholder="搜索笔记（空格分词）">
        <button id="searchClearBtn" class="search-clear-btn hidden" type="button" title="清空搜索"></button>
      </div>
      <button id="searchScopeBtn" class="scope-btn hidden" type="button" title="切换搜索范围：方框/圆点 ↔ 五角星 ↔ 全部"></button>

      <div id="topbarSpacer" class="topbar-spacer"></div>

      <div class="topbar-actions">
        <button id="trashBtn" class="icon-btn" type="button" title="回收站（右键打开记忆曲线设置）"></button>
        <button id="themeToggleBtn" class="icon-btn" type="button" title="切换深浅色模式"></button>
        <button id="logoutBtn" class="conn-indicator" type="button" title="断开电脑直连">
          <span id="connDot" class="status-dot"></span>
          <span id="connLabel">断开</span>
        </button>
      </div>
    </div>
  </header>

  <main id="canvasMain" class="canvas-main">
    <div id="notesList" class="notes-list"></div>
    <div id="canvasTail" class="canvas-tail">
      <button id="quickAddBtn" class="quick-add-line" type="button"></button>
    </div>
  </main>
</div>

<!-- ===== Modal Container ===== -->
<div id="modalBackdrop" class="modal-backdrop hidden"></div>

<!-- ===== Toast ===== -->
<div class="toast-wrap">
  <div id="toastBox" class="toast-box">
    <span id="toastMsg" class="toast-msg"></span>
    <button id="toastActionBtn" class="toast-action hidden" type="button"></button>
  </div>
</div>

  const DEFAULT_CURVE_CONFIG = {

  /* ===== Date & Formatting Utilities ===== */
  function localTodayString() {
    const d = new Date();
    return formatIsoDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }

  function formatIsoDate(y, m, d) {
    return String(y).padStart(4, '0') + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  function parseIsoDate(str) {
    const parts = String(str || '').split('-').map(Number);
    if (parts.length !== 3 || parts.some(isNaN)) return new Date();
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function addDays(dateStr, delta) {
    const d = parseIsoDate(dateStr);
    d.setDate(d.getDate() + delta);
    return formatIsoDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }

  function formatHeaderDate(dateStr) {
    const d = parseIsoDate(dateStr);
    const yy = String(d.getFullYear()).slice(-2);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return yy + '-' + mm + '-' + dd + ' ' + WEEKDAYS[d.getDay()];
  }

  function formatCompactAlarmTime(alarmMillis, noteDateStr) {
    const d = new Date(alarmMillis);
    const alarmDateStr = formatIsoDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    if (alarmDateStr === noteDateStr) return hh + ':' + mm;
    const todayYear = new Date().getFullYear();
    const mo = String(d.getMonth() + 1).padStart(2, '0');
    const da = String(d.getDate()).padStart(2, '0');
    if (d.getFullYear() === todayYear) return mo + '/' + da + ' ' + hh + ':' + mm;
    return d.getFullYear() + '/' + mo + '/' + da + ' ' + hh + ':' + mm;
  }

  function formatTrashRemaining(deletedAtMillis, nowMillis) {
    const remainMs = Math.max(0, deletedAtMillis + TRASH_RETENTION_MS - nowMillis);
    const remainHours = Math.floor(remainMs / (60 * 60 * 1000));
    if (remainHours <= 1) return '即将自动清理';
    if (remainHours < 24) return '约 ' + remainHours + ' 小时后清理';
    const days = Math.min(3, Math.max(1, Math.floor((remainHours + 23) / 24)));
    return '约 ' + days + ' 天后清理';
  }

  /* ===== Theme Management ===== */
  function initTheme() {
    const saved = localStorage.getItem('feinote_theme');
    if (saved === 'dark' || saved === 'light') {
      applyTheme(saved, false);
    } else {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark ? 'dark' : 'light', false);
    }
  }

  function applyTheme(mode, persist) {
    state.theme = mode === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', state.theme);
    if (persist) {
      try { localStorage.setItem('feinote_theme', state.theme); } catch (_) {}
    }
    const iconSvg = state.theme === 'dark' ? ICONS.sun : ICONS.moon;
    themeToggleBtn.innerHTML = iconSvg;
    authThemeBtn.innerHTML = iconSvg;
    themeToggleBtn.title = state.theme === 'dark' ? '切换为浅色模式' : '切换为深色模式';
  }

  function toggleTheme() {
    applyTheme(state.theme === 'dark' ? 'light' : 'dark', true);
  }

  /* ===== Spaced Repetition Math (1:1 Mirror of SpacedRepetitionEngine.kt) ===== */
  function normalizeCurveConfig(raw) {
    const src = raw || DEFAULT_CURVE_CONFIG;
    const safeMax = clampInt(src.maxIntervalDays, 7, 3650, 180);
    const safeUnfamiliar = clampInt(src.unfamiliarDays, 1, Math.min(30, safeMax), 1);
    const safeSomewhat = clampInt(src.initialSomewhatDays, 1, Math.min(60, safeMax), 2);
    const safeVery = clampInt(src.initialVeryDays, 1, Math.min(90, safeMax), 4);
    const safeEase = round2(clampFloat(src.initialEaseFactor, 1.3, 3.5, 2.5));
    const safeMult = round2(clampFloat(src.somewhatMultiplier, 0.3, 1.0, 0.75));
    return {
      unfamiliarDays: safeUnfamiliar,
      initialSomewhatDays: safeSomewhat,
      initialVeryDays: safeVery,
      initialEaseFactor: safeEase,
      somewhatMultiplier: safeMult,
      maxIntervalDays: safeMax
    };
  }

  function clampInt(val, min, max, fallback) {
    const n = parseInt(val, 10);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function clampFloat(val, min, max, fallback) {
    const n = parseFloat(val);
    if (!Number.isFinite(n) || n <= 0) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function round2(v) {
    return Math.round(v * 100) / 100;
  }

  function computeNextReview(note, familiarity, config) {
    const cfg = normalizeCurveConfig(config);
    const maxInterval = cfg.maxIntervalDays;
    const currentCount = Math.max(0, note.reviewCount || 0);
    const currentInterval = Math.min(maxInterval, Math.max(0, note.reviewIntervalDays || 0));
    const isInitial = currentCount <= 0 || currentInterval <= 0;
    const currentEase = (isInitial && !note.lastReviewedAt)
      ? cfg.initialEaseFactor
      : round2(clampFloat(note.easeFactor, 1.3, 3.5, 2.5));

    const somewhatInterval = isInitial
      ? Math.min(cfg.initialSomewhatDays, maxInterval)
      : Math.min(maxInterval, Math.max(currentInterval + 1, Math.round(currentInterval * currentEase * cfg.somewhatMultiplier)));

    let veryInterval;
    if (isInitial) {
      veryInterval = Math.min(cfg.initialVeryDays, maxInterval);
    } else {
      const base = Math.max(currentInterval + 2, Math.round(currentInterval * currentEase));
      const ordered = somewhatInterval < maxInterval ? Math.max(base, somewhatInterval + 1) : base;
      veryInterval = Math.min(maxInterval, ordered);
    }

    if (familiarity === 'UNFAMILIAR') {
      const days = Math.min(cfg.unfamiliarDays, maxInterval);
      return {
        nextReviewCount: 0,
        nextIntervalDays: days,
        nextEaseFactor: round2(Math.max(1.3, currentEase - 0.20))
      };
    }
    if (familiarity === 'SOMEWHAT_FAMILIAR') {
      return {
        nextReviewCount: currentCount + 1,
        nextIntervalDays: somewhatInterval,
        nextEaseFactor: round2(Math.max(1.3, currentEase - 0.05))
      };
    }
    return {
      nextReviewCount: currentCount + 1,
      nextIntervalDays: veryInterval,
      nextEaseFactor: round2(Math.min(3.5, currentEase + 0.15))
    };
  }

  function simulateIntervals(config, familiarity, steps) {
    const cfg = normalizeCurveConfig(config);
    let sim = {
      reviewCount: 0,
      reviewIntervalDays: 0,
      easeFactor: cfg.initialEaseFactor,
      lastReviewedAt: null
    };
    const out = [];
    for (let i = 0; i < (steps || 4); i++) {
      const res = computeNextReview(sim, familiarity, cfg);
      out.push(res.nextIntervalDays);
      sim = {
        reviewCount: res.nextReviewCount,
        reviewIntervalDays: res.nextIntervalDays,
        easeFactor: res.nextEaseFactor,
        lastReviewedAt: 1
      };
    }
    return out;
  }

  /* ===== Toast ===== */
  function showToast(message, actionLabel, onAction) {
    clearTimeout(state.toastTimer);
    toastMsg.textContent = message;
    state.toastUndoAction = null;
    if (actionLabel && typeof onAction === 'function') {
      toastActionBtn.textContent = actionLabel;
      toastActionBtn.classList.remove('hidden');
      state.toastUndoAction = onAction;
    } else {
      toastActionBtn.classList.add('hidden');
    }
    toastBox.classList.add('show');
    state.toastTimer = setTimeout(() => {
      hideToast();
    }, actionLabel ? 5200 : 2400);
  }

  function hideToast() {
    clearTimeout(state.toastTimer);
    toastBox.classList.remove('show');
    state.toastUndoAction = null;
  }

  toastActionBtn.addEventListener('click', () => {
    const fn = state.toastUndoAction;
    hideToast();
    if (fn) fn();
  });

  /* ===== HTTP API Wrapper ===== */
  async function api(path, options) {
    const opts = options || {};
    const method = (opts.method || 'GET').toUpperCase();
    const headers = {};
    if (opts.body !== undefined) {
      headers['Content-Type'] = 'application/json; charset=utf-8';
    }
    if (method !== 'GET' && state.csrfToken) {
      headers['X-FeiNote-Token'] = state.csrfToken;
    }
    const resp = await fetch(path, {
      method,
      headers,
      credentials: 'same-origin',
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
    });
    let data = {};
    try { data = await resp.json(); } catch (_) {}
    if (resp.status === 401 && path !== '/api/auth') {
      handleSessionExpired();
      throw new Error(data.error || '会话已过期');
    }
    if (!resp.ok) {
      const err = new Error(data.error || ('请求失败 (' + resp.status + ')'));
      err.status = resp.status;
      err.data = data;
      throw err;
    }
    setOnlineStatus(true);
    return data;
  }

  function setOnlineStatus(online) {
    state.online = online;
    connDot.classList.toggle('offline', !online);
    connLabel.textContent = online ? '断开' : '已断开';
  }

  function handleSessionExpired() {
    stopPolling();
    closeModal();
    state.csrfToken = '';
    state.editingNoteId = null;
    appView.classList.add('hidden');
    authView.classList.remove('hidden');
    authError.textContent = '连接已断开或配对码已刷新，请重新输入';
    pinInput.value = '';
    pinInput.focus();
  }

  /* ===== Auth Flow ===== */
  async function checkSession() {
    try {
      const res = await fetch('/api/session', { credentials: 'same-origin' });
      const data = await res.json();
      if (data && data.authenticated && data.csrfToken) {
        state.csrfToken = data.csrfToken;
        enterApp();
        return;
      }
    } catch (_) {}
    authView.classList.remove('hidden');
    appView.classList.add('hidden');
    pinInput.focus();
  }

  async function submitPin() {
    const pin = pinInput.value.trim();
    if (!/^\d{6}$/.test(pin)) {
      authError.textContent = '请输入 6 位数字配对码';
      pinInput.focus();
      return;
    }
    authError.textContent = '';
    authBtn.disabled = true;
    try {
      const data = await api('/api/auth', { method: 'POST', body: { pin } });
      state.csrfToken = data.csrfToken || '';
      pinInput.value = '';
      enterApp();
    } catch (err) {
      authError.textContent = err.message || '连接失败';
      pinInput.select();
    } finally {
      authBtn.disabled = false;
    }
  }

  async function enterApp() {
    authView.classList.add('hidden');
    appView.classList.remove('hidden');
    setOnlineStatus(true);
    await loadMeta(false);
    // If user never chose a theme on this browser, optionally align with phone on first load
    await loadCurrentView(false);
    startPolling();
  }

  async function disconnect() {
    await flushActiveEdit();
    try {
      await api('/api/logout', { method: 'POST', body: {} });
    } catch (_) {}
    stopPolling();
    closeModal();
    state.csrfToken = '';
    appView.classList.add('hidden');
    authView.classList.remove('hidden');
    authError.textContent = '';
    pinInput.focus();
  }

  /* ===== Data Fetching & Polling ===== */
  async function loadMeta(isPoll) {
    try {
      const suffix = isPoll ? '?poll=1' : '';
      const data = await api('/api/meta' + suffix);
      if (data.today) state.today = data.today;
      if (Array.isArray(data.activeDates)) {
        state.activeDates = new Set(data.activeDates);
      }
      state.earliestStarDate = data.earliestStarDate || null;
      state.trashCount = typeof data.trashCount === 'number' ? data.trashCount : 0;
      if (data.memoryCurveConfig) {
        state.memoryCurveConfig = normalizeCurveConfig(data.memoryCurveConfig);
      }
      renderTopBar();
    } catch (_) {
      if (isPoll) setOnlineStatus(false);
    }
  }

  async function loadCurrentView(isPoll) {
    try {
      if (state.isSearchMode) {
        const q = state.searchQuery.trim();
        if (!q) {
          state.notes = [];
          renderNotesList();
          return;
        }
        const url = '/api/search?q=' + encodeURIComponent(q) +
          '&scope=' + encodeURIComponent(state.searchScope) +
          (isPoll ? '&poll=1' : '');
        const data = await api(url);
        state.notes = Array.isArray(data.notes) ? data.notes : [];
      } else {
        const url = '/api/notes?date=' + encodeURIComponent(state.selectedDate) +
          (isPoll ? '&poll=1' : '');
        const data = await api(url);
        if (data.today) state.today = data.today;
        state.notes = Array.isArray(data.notes) ? data.notes : [];
      }
      renderTopBar();
      renderNotesList();
    } catch (_) {
      if (isPoll) setOnlineStatus(false);
    }
  }

  function startPolling() {
    stopPolling();
    state.pollTimer = setInterval(async () => {
      if (document.hidden || state.editingNoteId !== null || state.activeModal !== null || state.draggingNoteId !== null) {
        return;
      }
      await loadCurrentView(true);
      await loadMeta(true);
    }, 4000);
  }

  function stopPolling() {
    if (state.pollTimer) {
      clearInterval(state.pollTimer);
      state.pollTimer = null;
    }
  }

  /* ===== Top Bar Rendering ===== */
  function renderTopBar() {
    const isToday = state.selectedDate === state.today;

    if (state.isSearchMode) {
      leftSlotBtn.className = 'left-slot is-back';
      leftSlotBtn.textContent = '返回';
      leftSlotBtn.title = '返回今天';

      browseHeaderGroup.classList.add('hidden');
      searchHeaderGroup.classList.remove('hidden');
      searchScopeBtn.classList.remove('hidden');
      topbarSpacer.classList.add('hidden');

      searchClearBtn.innerHTML = ICONS.close;
      searchClearBtn.classList.toggle('hidden', !state.searchQuery);

      if (state.searchScope === 'star') {
        searchScopeBtn.innerHTML = ICONS.scopeStar;
        searchScopeBtn.title = '当前范围：仅五角星笔记（点击切换）';
      } else if (state.searchScope === 'all') {
        searchScopeBtn.textContent = '全';
        searchScopeBtn.style.fontSize = '13px';
        searchScopeBtn.style.fontWeight = '600';
        searchScopeBtn.title = '当前范围：全部笔记（点击切换）';
      } else {
        searchScopeBtn.style.fontSize = '';
        searchScopeBtn.style.fontWeight = '';
        searchScopeBtn.innerHTML = ICONS.scopeNormal;
        searchScopeBtn.title = '当前范围：方框与圆点笔记（点击切换）';
      }
    } else {
      browseHeaderGroup.classList.remove('hidden');
      searchHeaderGroup.classList.add('hidden');
      searchScopeBtn.classList.add('hidden');
      topbarSpacer.classList.remove('hidden');

      if (!isToday) {
        leftSlotBtn.className = 'left-slot is-back';
        leftSlotBtn.textContent = '返回';
        leftSlotBtn.title = '返回今天';
      } else {
        leftSlotBtn.className = 'left-slot';
        leftSlotBtn.innerHTML = ICONS.search;
        leftSlotBtn.title = '搜索笔记（右键直接搜索五角星）';
      }

      dateLabelBtn.textContent = formatHeaderDate(state.selectedDate);
    }

    // Trash icon + quiet count
    trashBtn.innerHTML = ICONS.trash;
    if (state.trashCount > 0) {
      const badge = document.createElement('span');
      badge.className = 'trash-count-dot';
      badge.textContent = state.trashCount > 99 ? '99' : String(state.trashCount);
      trashBtn.appendChild(badge);
    }

    // Quick add footer visibility
    if (state.isSearchMode) {
      canvasTail.classList.add('hidden');
    } else {
      canvasTail.classList.remove('hidden');
      quickAddBtn.innerHTML = '';
      const iconSpan = document.createElement('span');
      iconSpan.style.display = 'inline-flex';
      iconSpan.innerHTML = ICONS.plus;
      const textSpan = document.createElement('span');
      textSpan.textContent = state.notes.length === 0 ? '点击此处或空白区域开始记录' : '新建一条';
      quickAddBtn.appendChild(iconSpan);
      quickAddBtn.appendChild(textSpan);
    }
  }

  /* ===== Bullet Icon Helper ===== */
  function bulletSvgFor(type) {
    switch (type) {
      case 'BULLET_DOT': return ICONS.bulletDot;
      case 'STAR': return ICONS.bulletStar;
      case 'CHECKED': return ICONS.bulletChecked;
      default: return ICONS.bulletSquare;
    }
  }

  /* ===== Render Notes List (Strictly DOM textContent — Zero Untrusted innerHTML) ===== */
  function renderNotesList() {
    notesList.innerHTML = '';

    if (state.isSearchMode) {
      if (!state.searchQuery.trim()) {
        return;
      }
      if (state.notes.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = '未找到匹配的笔记';
        notesList.appendChild(empty);
        return;
      }
    }

    const nowMs = Date.now();
    let lastDateGroup = null;

    state.notes.forEach((note) => {
      if (state.isSearchMode && note.dateString !== lastDateGroup) {
        lastDateGroup = note.dateString;
        const groupHead = document.createElement('div');
        groupHead.className = 'search-date-header';
        const link = document.createElement('button');
        link.type = 'button';
        link.className = 'search-date-link';
        link.textContent = formatHeaderDate(note.dateString);
        link.title = '跳转到该日期';
        link.addEventListener('click', async () => {
          await flushActiveEdit();
          state.isSearchMode = false;
          state.searchQuery = '';
          searchInput.value = '';
          state.selectedDate = note.dateString;
          await loadCurrentView(false);
        });
        groupHead.appendChild(link);
        notesList.appendChild(groupHead);
      }

      const isEditing = state.editingNoteId === note.id;
      const row = document.createElement('div');
      row.className = 'note-row' + (isEditing ? ' editing' : '');
      row.dataset.noteId = String(note.id);

      // Drag & Drop in Date Browse Mode only
      if (!state.isSearchMode && !isEditing) {
        row.draggable = true;
        row.addEventListener('dragstart', (e) => {
          if (state.editingNoteId !== null) {

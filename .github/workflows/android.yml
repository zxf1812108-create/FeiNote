name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute yearly version (2026=1.x, 2027=2.x, ...)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          YEAR=$(TZ=Asia/Shanghai date +%Y)
          MAJOR=$((YEAR - 2025))
          if [ "$MAJOR" -lt 1 ]; then
            MAJOR=1
          fi

          # 按北京时间统计当年本工作流的构建次数；每次运行严格 +1，次年 1 月 1 日自动从 1 开始
          PREV_YEAR=$((YEAR - 1))
          SINCE_UTC="${PREV_YEAR}-12-31T16:00:00Z"
          WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          MINOR=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs" \
            -f "created=>=${SINCE_UTC}" \
            -f "per_page=1" \
            --jq '.total_count' 2>/dev/null || echo "")

          # 兜底：若 API 临时不可用，退回统计当年提交数
          if ! [[ "$MINOR" =~ ^[0-9]+$ ]] || [ "$MINOR" -lt 1 ]; then
            MINOR=$(git rev-list --count --since="${YEAR}-01-01 00:00:00 +0800" HEAD 2>/dev/null || echo "1")
            if [ "$MINOR" -lt 1 ]; then
              MINOR=1
            fi
          fi

          VERSION_NAME="${MAJOR}.${MINOR}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR))
          echo "APP_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION_NAME} (versionCode=${VERSION_CODE})"

      - name: Ensure fixed signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "ERROR: 仓库根目录缺少 debug.keystore 或 debug.keystore.base64"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeiNote-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk

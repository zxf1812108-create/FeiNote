name: Build Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compute yearly version (2026=1.12+, 2027=2.1+, ...)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          YEAR=$(TZ=Asia/Shanghai date +%Y)
          MAJOR=$((YEAR - 2025))
          if [ "$MAJOR" -lt 1 ]; then
            MAJOR=1
          fi

          WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          SUCCESS_COUNT=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs" \
            -f "status=success" \
            -f "created=>=${YEAR}-01-01" \
            -f "per_page=1" \
            --jq '.total_count' 2>/dev/null || echo "0")

          if ! [[ "$SUCCESS_COUNT" =~ ^[0-9]+$ ]]; then
            SUCCESS_COUNT=0
          fi

          # 2026 年校准偏移（截至 1.244 共 244 次成功构建，244 - 232 = 12，使下一次精准为 1.12）；
          # 2027 年及以后自动从当年 1 月 1 日归零，从 2.1、3.1 起步。
          if [ "$YEAR" -eq 2026 ]; then
            MINOR=$((SUCCESS_COUNT - 232))
          else
            MINOR=$((SUCCESS_COUNT + 1))
          fi
          if [ "$MINOR" -lt 1 ]; then
            MINOR=1
          fi

          VERSION_NAME="${MAJOR}.${MINOR}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR))

          echo "APP_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION_NAME} (versionCode=${VERSION_CODE}, success_count=${SUCCESS_COUNT})"

      - name: Ensure fixed signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "ERROR: 仓库根目录缺少 debug.keystore 或 debug.keystore.base64"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeiNote-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk

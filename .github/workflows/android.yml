name: Build Android Release APK

on:
  workflow_dispatch:
  # 如希望每次提交自动打包，取消下面两行注释即可：
  # push:
  #   branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compute yearly version (2026=1.1+, 2027=2.1+, ...)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          YEAR=$(TZ=Asia/Shanghai date +%Y)
          MAJOR=$((YEAR - 2025))
          if [ "$MAJOR" -lt 1 ]; then
            MAJOR=1
          fi

          # 2026 年从新规则启用时间起算（让下一版从 1.1 起步）；2027 年及以后从当年北京时间 1 月 1 日 00:00 起算
          if [ "$YEAR" -eq 2026 ]; then
            SINCE_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # 若你把下面这行改成固定的当前 UTC 时间（例如 "2026-04-20T00:00:00Z"），之后就会稳定从 1.1, 1.2, 1.3 递增
            SINCE_UTC="2026-04-20T00:00:00Z"
          else
            PREV_YEAR=$((YEAR - 1))
            SINCE_UTC="${PREV_YEAR}-12-31T16:00:00Z"
          fi

          WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          SUCCESS_COUNT=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs" \
            -f "status=success" \
            -f "created=>=${SINCE_UTC}" \
            -f "per_page=1" \
            --jq '.total_count' 2>/dev/null || echo "0")

          if ! [[ "$SUCCESS_COUNT" =~ ^[0-9]+$ ]]; then
            SUCCESS_COUNT=0
          fi

          # 已成功次数 + 1 = 本次版本号
          MINOR=$((SUCCESS_COUNT + 1))
          VERSION_NAME="${MAJOR}.${MINOR}"
          VERSION_CODE=$((MAJOR * 100000 + MINOR))

          echo "APP_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION_NAME} (versionCode=${VERSION_CODE})"

      - name: Ensure fixed signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "ERROR: 仓库根目录缺少 debug.keystore 或 debug.keystore.base64"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeiNote-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
